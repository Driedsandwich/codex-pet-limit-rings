name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    steps:
      - uses: actions/checkout@v6
      # package-release runs verify-release, including tests and privacy gates.
      - name: Verify source and build the current package candidate
        run: tools/package-release.sh
      - name: Smoke-test the pinned v1.0.0 provenance baseline
        env:
          EXPECTED_MIN_OS: "15.0"
          EXPECTED_SHA256: "21d1eb306b3b3211c1911636e6cf3544bf94064af160b6f061949595b369229a"
          # v1.0.0 predates release-path sanitization; this exception is limited
          # to its fixed digest and does not apply to current artifacts.
          ALLOW_LEGACY_LOCAL_PATHS: "1"
        run: |
          tools/smoke-release-artifact.sh 1.0.0
      - name: Smoke-test the pinned published v1.0.9 compatibility baseline
        env:
          EXPECTED_MIN_OS: "15.0"
          EXPECTED_SHA256: "e085c5ee47e9a8ebafbc8cb6d2788d673b26c85ab1b520792bbe5da8b42aa273"
        run: |
          tools/smoke-release-artifact.sh 1.0.9
      - name: Smoke-test the pinned latest v1.0.14 release
        env:
          EXPECTED_MIN_OS: "15.0"
          EXPECTED_SHA256: "7e4ebe4b43fd9b73ea7668fa5394136736db58b30c95ed633aac09f6bf66bb47"
        run: tools/smoke-release-artifact.sh 1.0.14
